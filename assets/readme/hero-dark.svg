<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="236" viewBox="0 0 1200 236" role="img" aria-labelledby="title desc">
  <title id="title">Piyal Dey — AI Engineer</title>
  <desc id="desc">Piyal Dey, AI Engineer at Plant Supervision in Aalborg, Denmark. Designs and ships AI applications end to end: agents, retrieval, APIs, front ends and the infrastructure they run on. Python, TypeScript, Azure, Hetzner, Kubernetes.</desc>
  <defs>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#3FB950" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="0" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="2" fill="#8B949E">AI ENGINEER · AALBORG, DENMARK</text>
    <text x="-4" y="112" font-size="84" font-weight="700" letter-spacing="-2" fill="#E6EDF3">Piyal Dey</text>
    <rect x="0" y="130" width="560" height="3" rx="1.5" fill="url(#rule)"/>
    <text x="0" y="172" font-size="24" fill="#C9D1D9">Designing and shipping AI applications end to end:</text>
    <text x="0" y="204" font-size="24" fill="#C9D1D9">agents, retrieval, APIs, front ends and the infrastructure they run on.</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" text-anchor="end">
    <text x="1200" y="58" font-size="16" letter-spacing="1.5" fill="#8B949E">ROLE</text>
    <text x="1200" y="82" fill="#E6EDF3">AI Engineer, Plant Supervision</text>
    <text x="1200" y="122" font-size="16" letter-spacing="1.5" fill="#8B949E">EDUCATION</text>
    <text x="1200" y="146" fill="#E6EDF3">MSc Business Data Science, Aalborg University</text>
    <text x="1200" y="186" font-size="16" letter-spacing="1.5" fill="#8B949E">STACK</text>
    <text x="1200" y="210" fill="#E6EDF3">Python · TypeScript · Azure · Hetzner · Kubernetes</text>
  </g>
</svg>
