<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Piyal Dey — AI Engineer and Data Scientist</title>
  <desc id="desc">Piyal Dey builds AI applications end to end: agent workflows, RAG pipelines, forecasting models, and the backend, frontend and infrastructure around them. Python, TypeScript, Azure and Hetzner.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F14"/>
      <stop offset="1" stop-color="#101826"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="24" fill="none" stroke="#1F2A37"/>

  <!-- Title block -->
  <g id="title-block" transform="translate(64 0)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="1" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="1.6" fill="#8B949E">AI ENGINEER · DATA SCIENTIST · AALBORG, DENMARK</text>
    <text x="-3" y="150" font-size="76" font-weight="700" letter-spacing="-1.5" fill="#E6EDF3">Piyal Dey</text>
    <text x="0" y="196" font-size="24" fill="#C9D1D9">I build AI applications end to end:</text>
    <text x="0" y="228" font-size="24" fill="#C9D1D9">agent workflows, RAG pipelines, forecasting models,</text>
    <text x="0" y="260" font-size="24" fill="#C9D1D9">and the backend, frontend and infra around them.</text>
    <g transform="translate(0 296)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8B949E">
      <text x="0" y="8">Python</text>
      <circle cx="84" cy="2" r="3" fill="#58A6FF"/>
      <text x="100" y="8">TypeScript</text>
      <circle cx="226" cy="2" r="3" fill="#58A6FF"/>
      <text x="242" y="8">Azure</text>
      <circle cx="316" cy="2" r="3" fill="#58A6FF"/>
      <text x="332" y="8">Hetzner</text>
    </g>
  </g>

  <!-- Project material: how a typical build is layered -->
  <g id="stack" transform="translate(690 52)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="0" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="1.4" fill="#8B949E">A TYPICAL BUILD, TOP TO BOTTOM</text>

    <!-- connector -->
    <line x1="-22" y1="59" x2="-22" y2="239" stroke="#30363D" stroke-width="2"/>
    <circle cx="-22" cy="59" r="5" fill="#58A6FF"/>
    <circle cx="-22" cy="119" r="5" fill="#58A6FF"/>
    <circle cx="-22" cy="179" r="5" fill="#58A6FF"/>
    <circle cx="-22" cy="239" r="5" fill="#3FB950"/>

    <!-- layer 1 -->
    <rect x="0" y="34" width="446" height="50" rx="12" fill="#161B22" stroke="#30363D"/>
    <text x="18" y="65" font-size="19" font-weight="700" fill="#E6EDF3">Agents &amp; LLM</text>
    <text x="428" y="65" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8B949E">CrewAI · LangGraph · RAG</text>

    <!-- layer 2 -->
    <rect x="0" y="94" width="446" height="50" rx="12" fill="#161B22" stroke="#30363D"/>
    <text x="18" y="125" font-size="19" font-weight="700" fill="#E6EDF3">Backend</text>
    <text x="428" y="125" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8B949E">FastAPI · Python · SQL</text>

    <!-- layer 3 -->
    <rect x="0" y="154" width="446" height="50" rx="12" fill="#161B22" stroke="#30363D"/>
    <text x="18" y="185" font-size="19" font-weight="700" fill="#E6EDF3">Frontend</text>
    <text x="428" y="185" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8B949E">React · TypeScript · Vite</text>

    <!-- layer 4 -->
    <rect x="0" y="214" width="446" height="50" rx="12" fill="#161B22" stroke="#3FB950" stroke-opacity="0.55"/>
    <text x="18" y="245" font-size="19" font-weight="700" fill="#E6EDF3">Infra</text>
    <text x="428" y="245" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8B949E">Azure · Hetzner · Docker · CI/CD</text>
  </g>
</svg>
